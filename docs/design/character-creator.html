<title>Island Character Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --sand: #f2ebdb; --panel: #fcf8ee; --panel-2: #eee4cf;
    --ink: #2f2a25; --ink-soft: #796e5f; --line: #dcceb3;
    --sea: #1f6f6a; --sea-tint: #dceae7; --on-sea: #fcf8ee;
    --marigold: #c6850f;
    --grass: #7aa85c; --grass-2: #6b9950; --grass-3: #5b8744;
    --sky-1: #cfe6ea; --sky-2: #eef1e2;
    --shadow: 0 2px 0 rgba(47, 42, 37, .07);
    --display: "Baloo 2", "Trebuchet MS", sans-serif;
    --body: "Karla", "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sand: #141a1b; --panel: #1d2426; --panel-2: #27302f;
      --ink: #ece4d6; --ink-soft: #9ba79d; --line: #36413f;
      --sea: #6ac2b5; --sea-tint: #1d302e; --on-sea: #0f1a19;
      --marigold: #e0ac4d;
      --grass: #4e7b44; --grass-2: #446d3c; --grass-3: #385c32;
      --sky-1: #1b2b33; --sky-2: #16201f;
      --shadow: 0 2px 0 rgba(0, 0, 0, .28);
    }
  }
  :root[data-theme="dark"] {
    --sand: #141a1b; --panel: #1d2426; --panel-2: #27302f;
    --ink: #ece4d6; --ink-soft: #9ba79d; --line: #36413f;
    --sea: #6ac2b5; --sea-tint: #1d302e; --on-sea: #0f1a19;
    --marigold: #e0ac4d;
    --grass: #4e7b44; --grass-2: #446d3c; --grass-3: #385c32;
    --sky-1: #1b2b33; --sky-2: #16201f;
    --shadow: 0 2px 0 rgba(0, 0, 0, .28);
  }

  * { box-sizing: border-box; }
  body { background: var(--sand); color: var(--ink); font-family: var(--body); line-height: 1.45; font-size: 15px; -webkit-font-smoothing: antialiased; height: 100dvh; overflow: hidden; }
  h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 700; text-wrap: balance; }
  canvas { image-rendering: pixelated; display: block; }

  /* ---------- shell: the character never leaves the screen ---------- */
  .app { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 16px; height: 100dvh; padding: 14px 16px; }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 12px; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 9px; flex: none; }
  #stage { border-radius: 11px; width: 100%; max-width: 244px; height: auto; }
  .dirs { display: flex; gap: 5px; }
  .dirs button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; cursor: pointer; line-height: 0; height: 52px; overflow: hidden; }
  .dirs button[aria-pressed="true"] { border-color: var(--sea); box-shadow: inset 0 0 0 1px var(--sea); background: var(--sea-tint); }
  .dirs canvas { width: 44px; height: auto; }
  .nameplate { width: 100%; border-top: 1px dashed var(--line); padding-top: 8px; text-align: center; }
  .nameplate .who { font-family: var(--display); font-size: 19px; line-height: 1.1; }
  .nameplate .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .stage-actions { display: flex; gap: 7px; width: 100%; }
  .stage-actions button { flex: 1; }

  button.btn { font-family: var(--body); font-weight: 600; font-size: 13.5px; cursor: pointer; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; box-shadow: var(--shadow); }
  button.btn:hover { border-color: var(--sea); color: var(--sea); }
  button.btn.primary { background: var(--sea); border-color: var(--sea); color: var(--on-sea); }
  button.btn.primary:hover { filter: brightness(1.07); color: var(--on-sea); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn:disabled:hover { border-color: var(--line); color: var(--ink); }

  .savecard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; box-shadow: var(--shadow); flex: none; }
  .savecard .save-state { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); display: block; margin-bottom: 7px; }
  .savecard button { width: 100%; }

  /* ---------- steps ---------- */
  .head { flex: none; }
  .head .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--sea); }
  .head h1 { font-size: 23px; line-height: 1.1; }

  .steps { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  .steps button {
    font-family: var(--body); font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 99px; padding: 6px 13px; display: inline-flex; align-items: baseline; gap: 6px;
  }
  .steps button em { font-family: var(--mono); font-style: normal; font-size: 10px; opacity: .7; }
  .steps button:hover { border-color: var(--sea); color: var(--sea); }
  .steps button[aria-current="true"] { background: var(--sea); border-color: var(--sea); color: var(--on-sea); }

  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sheet-scroll { overflow-y: auto; padding: 16px 18px 18px; flex: 1; min-height: 0; }
  .sheet h2 { font-size: 19px; }
  .sheet .sub { color: var(--ink-soft); font-size: 13.5px; margin: 2px 0 0; max-width: 64ch; }
  .foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; flex: none; }

  .field { margin-top: 16px; }
  .field > label, .field > .lab { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }

  /* every picker shows the part it changes, on your character */
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .grid button {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 3px 3px 0; cursor: pointer; line-height: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .grid button:hover { border-color: var(--sea); }
  .grid button[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-tint); box-shadow: inset 0 0 0 1px var(--sea); }
  .grid button span {
    font-family: var(--body); font-size: 9.5px; line-height: 1.25; color: var(--ink-soft);
    padding: 2px 2px 3px; max-width: 62px; text-align: center; white-space: normal;
  }
  .grid button[aria-pressed="true"] span { color: var(--ink); font-weight: 600; }

  input[type="text"], select { font-family: var(--body); font-size: 14.5px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; width: 100%; max-width: 280px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .row > div { flex: 1 1 140px; min-width: 130px; }
  input[type="range"] { width: 100%; max-width: 240px; accent-color: var(--sea); }
  .sign-chip { display: inline-flex; font-family: var(--mono); font-size: 12px; background: var(--sea-tint); color: var(--sea); border-radius: 99px; padding: 5px 12px; font-weight: 500; }
  .voice-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* ---------- neighbours ---------- */
  .folk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 14px; }
  .folk-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 7px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-align: center; font-family: inherit; color: inherit; }
  .folk-card:hover { border-color: var(--sea); }
  .folk-card[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-tint); box-shadow: inset 0 0 0 1px var(--sea); }
  .folk-card canvas { width: 52px; height: auto; }
  .folk-card b { font-family: var(--display); font-size: 13px; font-weight: 600; }
  .folk-card span { font-family: var(--mono); font-size: 9px; color: var(--ink-soft); }
  .dossier { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; }
  .dossier canvas { width: 78px; height: auto; }
  .dossier .job { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--sea); }
  .dossier h3 { font-size: 19px; }
  .dossier .pers { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; }
  .dossier blockquote { margin: 9px 0 0; padding-left: 11px; border-left: 3px solid var(--marigold); font-style: italic; max-width: 56ch; }

  :focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 880px) {
    body { overflow: auto; height: auto; }
    .app { grid-template-columns: minmax(0, 1fr); height: auto; padding: 10px 12px 28px; }
    .stage { position: sticky; top: 8px; z-index: 5; flex-direction: row; align-items: flex-start; gap: 12px; }
    #stage { max-width: 118px; }
    .stage .right { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
    .nameplate { border-top: 0; padding-top: 0; text-align: left; }
    .sheet { height: auto; }
    .sheet-scroll { overflow: visible; }
  }
</style>

<div class="app">
  <div class="col">
    <div class="stage">
      <canvas id="stage" width="244" height="352" aria-label="Your character, standing on grass"></canvas>
      <div class="right">
        <div class="dirs" id="dirs" role="group" aria-label="Facing direction"></div>
        <div class="nameplate">
          <div class="who" id="plate-name">Your islander</div>
          <div class="meta" id="plate-meta">&mdash;</div>
        </div>
        <div class="stage-actions">
          <button class="btn" id="walk-btn" type="button" aria-pressed="false">Walk</button>
          <button class="btn" id="roll-btn" type="button">Surprise me</button>
        </div>
      </div>
    </div>
    <div class="savecard">
      <span class="save-state" id="save-state">Not saved yet</span>
      <button class="btn primary" id="save-btn" type="button">Save character</button>
    </div>
  </div>

  <div class="col">
    <div class="head">
      <p class="kicker">Build 0.3 &middot; character system &middot; roughly half-done</p>
      <h1>Who are you going to be?</h1>
    </div>
    <nav class="steps" id="steps" aria-label="Parts"></nav>
    <div class="sheet">
      <div class="sheet-scroll" id="sheet"></div>
      <div class="foot">
        <button class="btn" id="prev-btn" type="button">&larr; Back</button>
        <button class="btn" id="next-btn" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

<script src="sprite.js"></script>
<script src="villagers.js"></script>
<script>
(function () {
  "use strict";
  var S = window.CozySprite, V = window.CozyVillagers;
  var MONTHS = ["January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"];

  var char = S.defaultChar();
  var dir = "down", frame = 0, walking = false, timer = null, docRef = null;
  var step = 0;
  var stage = document.getElementById("stage");
  var sctx = stage.getContext("2d");
  var SCALE = 6;

  /* Each picker names the field it sets, the list it comes from and the band
   * of the sprite it should show — so you always see the part you're changing,
   * on the character you're actually building. */
  var STEPS = [
    { id: "skin", name: "Skin", blurb: "Twenty-two tones, and the small things that make a face particular.",
      fields: [
        { lab: "Skin tone", key: "skin", list: "SKINS", crop: "head", scale: 3 },
        { lab: "Face", key: "details", list: "DETAILS", crop: "head", scale: 3 }
      ] },
    { id: "hair", name: "Hair", blurb: "Forty cuts and thirty-two colours. Eyebrows and beards follow the colour, unless you dye it.",
      fields: [
        { lab: "Cut", key: "hairStyle", list: "HAIR_STYLES", crop: "head", scale: 3 },
        { lab: "Colour", key: "hairColor", list: "HAIRS", crop: "head", scale: 2 },
        { lab: "Dye", key: "hairAccent", list: "HAIR_ACCENT", crop: "head", scale: 3 },
        { lab: "Dye colour", key: "hairAccentColor", list: "HAIRS", crop: "head", scale: 2, needs: "hairAccent" }
      ] },
    { id: "face", name: "Face", blurb: "Brows, eyes and everything below the nose.",
      fields: [
        { lab: "Eyebrows", key: "eyebrows", list: "EYEBROWS", crop: "head", scale: 3 },
        { lab: "Eyes", key: "eyeShape", list: "EYE_SHAPES", crop: "head", scale: 3 },
        { lab: "Eye colour", key: "eyeColor", list: "EYE_COLORS", crop: "head", scale: 3 },
        { lab: "Facial hair", key: "beard", list: "FACIAL_HAIR", crop: "head", scale: 3 }
      ] },
    { id: "clothes", name: "Clothes", blurb: "Day one clothes. The wardrobe grows once the shop opens.",
      fields: [
        { lab: "Outfit", key: "outfit", list: "OUTFITS", crop: "torso", scale: 3 },
        { lab: "Top colour", key: "topColor", list: "CLOTH", crop: "torso", scale: 2 },
        { lab: "Trousers &amp; skirt", key: "bottomColor", list: "CLOTH", crop: "legs", scale: 2 },
        { lab: "Shoes", key: "shoeColor", list: "CLOTH", crop: "legs", scale: 2 }
      ] },
    { id: "extras", name: "Extras", blurb: "Hats, glasses, bags. Wear as many as you like.",
      fields: [
        { lab: "Extras", key: "accessories", list: "ACCESSORIES", crop: "bust", scale: 2, multi: true },
        { lab: "Accent colour &mdash; aprons, dungarees, waistcoats, coats, the sundress sash and every extra",
          key: "accColor", list: "CLOTH", swatch: true }
      ] },
    { id: "you", name: "You", blurb: "Your birthday sets your star sign, and the whole island turns up for it.", custom: "about" },
    { id: "folk", name: "Neighbours", blurb: "Twenty-four people, written rather than rolled. Pick anyone to meet them.", custom: "folk" }
  ];

  /* ---------- the grass ---------- */

  function rng(seed) { return function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }; }

  function paintGround() {
    var w = stage.width, h = stage.height, p = 8;
    var css = getComputedStyle(document.documentElement);
    sctx.fillStyle = css.getPropertyValue("--grass").trim();
    sctx.fillRect(0, 0, w, h);
    var r = rng(4711);
    sctx.fillStyle = css.getPropertyValue("--grass-2").trim();
    for (var i = 0; i < 110; i++) sctx.fillRect(Math.floor(r() * w / p) * p, Math.floor(r() * h / p) * p, p, p);
    sctx.fillStyle = css.getPropertyValue("--grass-3").trim();
    for (var j = 0; j < 36; j++) {
      var x = Math.floor(r() * w / p) * p, y = Math.floor(r() * h / p) * p;
      sctx.fillRect(x, y, p, p); sctx.fillRect(x + p, y + p, p, p);
    }
    var petals = ["#f2e2a0", "#efa7bc", "#f6f2ea"];
    for (var k = 0; k < 7; k++) {
      var fx = Math.floor(r() * (w / p - 2)) * p, fy = Math.floor((0.5 + r() * 0.45) * h / p) * p;
      sctx.fillStyle = petals[k % petals.length];
      sctx.fillRect(fx, fy, p, p);
      sctx.fillStyle = "#e9c94f"; sctx.fillRect(fx + 3, fy + 3, 2, 2);
    }
  }

  function paintStage() {
    paintGround();
    var g = S.build(char, dir, frame);
    var ox = Math.round((stage.width - S.W * SCALE) / 2);
    var oy = Math.round((stage.height - S.H * SCALE) / 2) + 8;
    sctx.fillStyle = "rgba(28, 40, 22, .2)";
    sctx.fillRect(ox + 6 * SCALE, oy + 50 * SCALE, 14 * SCALE, SCALE);
    for (var y = 0; y < S.H; y++) for (var x = 0; x < S.W; x++) {
      var c = g.px[y * S.W + x];
      if (!c) continue;
      sctx.fillStyle = c;
      sctx.fillRect(ox + x * SCALE, oy + y * SCALE, SCALE, SCALE);
    }
  }

  /* ---------- direction picker ---------- */

  var DIRS = [["down", "Front"], ["left", "Left"], ["right", "Right"], ["up", "Back"]];
  function buildDirs() {
    var host = document.getElementById("dirs");
    DIRS.forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", d[1]);
      b.dataset.dir = d[0];
      b.appendChild(document.createElement("canvas"));
      b.addEventListener("click", function () { dir = d[0]; refresh(); });
      host.appendChild(b);
    });
  }
  function refreshDirs() {
    document.querySelectorAll("#dirs button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.dir === dir));
      S.render(b.querySelector("canvas"), char, b.dataset.dir, 0, 2, S.CROP.head);
    });
  }

  /* ---------- steps ---------- */

  function buildStepNav() {
    var host = document.getElementById("steps");
    STEPS.forEach(function (st, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<em>' + (i + 1) + '</em>' + st.name;
      b.addEventListener("click", function () { goto(i); });
      host.appendChild(b);
    });
  }

  function goto(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    document.querySelectorAll("#steps button").forEach(function (b, n) {
      b.setAttribute("aria-current", String(n === step));
    });
    document.getElementById("prev-btn").disabled = step === 0;
    document.getElementById("next-btn").disabled = step === STEPS.length - 1;
    document.getElementById("sheet").scrollTop = 0;
    renderStep();
  }

  function labelOf(item) { return typeof item === "string" ? item : item.n; }

  function renderStep() {
    var st = STEPS[step];
    var sheet = document.getElementById("sheet");
    sheet.innerHTML = "";
    var h = document.createElement("h2"); h.textContent = st.name;
    var p = document.createElement("p"); p.className = "sub"; p.textContent = st.blurb;
    sheet.appendChild(h); sheet.appendChild(p);

    if (st.custom === "about") return renderAbout(sheet);
    if (st.custom === "folk") return renderFolk(sheet);

    st.fields.forEach(function (f) {
      if (f.needs && !char[f.needs]) return;
      var wrap = document.createElement("div");
      wrap.className = "field";
      var lab = document.createElement("span");
      lab.className = "lab"; lab.innerHTML = f.lab;
      var grid = document.createElement("div");
      grid.className = "grid";
      wrap.appendChild(lab); wrap.appendChild(grid);
      sheet.appendChild(wrap);

      S[f.list].forEach(function (item, i) {
        var value = f.multi ? item : i;
        var on = f.multi ? char.accessories.indexOf(item) >= 0 : char[f.key] === i;
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-pressed", String(on));
        b.title = labelOf(item);

        var preview = Object.assign({}, char);
        if (f.multi) {
          preview.accessories = on ? char.accessories.filter(function (a) { return a !== item; })
                                   : char.accessories.concat([item]);
        } else {
          preview[f.key] = i;
        }
        if (f.swatch) {
          var chip = document.createElement("i");
          chip.style.cssText = "display:block;width:44px;height:26px;border-radius:6px;background:" + item.b;
          b.appendChild(chip);
        } else {
          var cv = document.createElement("canvas");
          S.render(cv, preview, f.crop === "torso" || f.crop === "legs" ? "down" : dir, 0, f.scale, S.CROP[f.crop]);
          cv.style.width = (S.W * f.scale) + "px";
          b.appendChild(cv);
        }
        var cap = document.createElement("span");
        cap.textContent = labelOf(item);
        b.appendChild(cap);

        b.addEventListener("click", function () {
          if (f.multi) {
            var at = char.accessories.indexOf(item);
            if (at >= 0) char.accessories.splice(at, 1); else char.accessories.push(item);
          } else {
            char[f.key] = i;
          }
          refresh();
          renderStep();
        });
        grid.appendChild(b);
      });
    });
  }

  function renderAbout(sheet) {
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="field row">' +
        '<div><label for="f-name">Name</label><input type="text" id="f-name" maxlength="16" placeholder="Wren" autocomplete="off"></div>' +
        '<div><label for="f-town">Hometown</label><input type="text" id="f-town" maxlength="20" placeholder="Saltbrook" autocomplete="off"></div>' +
      '</div>' +
      '<div class="field row">' +
        '<div><label for="f-month">Birth month</label><select id="f-month"></select></div>' +
        '<div><label for="f-day">Day</label><select id="f-day"></select></div>' +
        '<div style="flex:1 1 100%"><span class="lab">Star sign</span><span class="sign-chip" id="f-sign">&mdash;</span></div>' +
      '</div>' +
      '<div class="field"><label for="f-voice">Voice pitch</label><div class="voice-row">' +
        '<input type="range" id="f-voice" min="0" max="10" step="1"><button class="btn" id="voice-btn" type="button">Hear it</button>' +
      '</div></div>';
    sheet.appendChild(wrap);

    var m = document.getElementById("f-month"), d = document.getElementById("f-day");
    MONTHS.forEach(function (name, i) { var o = document.createElement("option"); o.value = String(i + 1); o.textContent = name; m.appendChild(o); });
    for (var i = 1; i <= 31; i++) { var o2 = document.createElement("option"); o2.value = String(i); o2.textContent = String(i); d.appendChild(o2); }

    document.getElementById("f-name").value = char.name || "";
    document.getElementById("f-town").value = char.hometown || "";
    m.value = String(char.birthMonth); d.value = String(char.birthDay);
    document.getElementById("f-voice").value = String(char.voice);

    m.addEventListener("change", function () { char.birthMonth = Number(m.value); refresh(); });
    d.addEventListener("change", function () { char.birthDay = Number(d.value); refresh(); });
    document.getElementById("f-name").addEventListener("input", function () { char.name = this.value; refreshPlate(); markUnsaved(); });
    document.getElementById("f-town").addEventListener("input", function () { char.hometown = this.value; refreshPlate(); markUnsaved(); });
    document.getElementById("f-voice").addEventListener("input", function () { char.voice = Number(this.value); markUnsaved(); });
    document.getElementById("f-voice").addEventListener("change", speak);
    document.getElementById("voice-btn").addEventListener("click", speak);
    refreshPlate();
  }

  var roster = V.roster(S.defaultChar());

  function renderFolk(sheet) {
    var grid = document.createElement("div");
    grid.className = "folk-grid";
    sheet.appendChild(grid);
    var dossier = document.createElement("div");
    dossier.className = "dossier";
    dossier.innerHTML = '<canvas id="dossier-art"></canvas><div>' +
      '<p class="job" id="dossier-job"></p><h3 id="dossier-name"></h3>' +
      '<p class="pers" id="dossier-pers"></p><blockquote id="dossier-line"></blockquote></div>';
    sheet.appendChild(dossier);

    roster.forEach(function (v, i) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "folk-card";
      card.dataset.i = String(i);
      var cv = document.createElement("canvas");
      S.render(cv, v.record, "down", 0, 2);
      card.appendChild(cv);
      var b = document.createElement("b"); b.textContent = v.name;
      var sp = document.createElement("span"); sp.textContent = v.job;
      card.appendChild(b); card.appendChild(sp);
      card.addEventListener("click", function () { showVillager(i); });
      grid.appendChild(card);
    });
    showVillager(0);
  }

  function showVillager(i) {
    var v = roster[i];
    document.querySelectorAll(".folk-card").forEach(function (c) {
      c.setAttribute("aria-pressed", String(Number(c.dataset.i) === i));
    });
    S.render(document.getElementById("dossier-art"), v.record, "down", 0, 3);
    document.getElementById("dossier-job").textContent = v.job;
    document.getElementById("dossier-name").textContent = v.name;
    document.getElementById("dossier-pers").textContent =
      v.personality + "  ·  born " + MONTHS[v.record.birthMonth - 1] + " " + v.record.birthDay +
      ", " + S.starSign(v.record.birthMonth, v.record.birthDay);
    document.getElementById("dossier-line").textContent = "“" + v.line + "”";
  }

  /* ---------- shared ---------- */

  function refreshPlate() {
    var sign = S.starSign(char.birthMonth, char.birthDay);
    document.getElementById("plate-name").textContent = (char.name || "").trim() || "Your islander";
    document.getElementById("plate-meta").textContent =
      MONTHS[char.birthMonth - 1] + " " + char.birthDay + "  ·  " + sign +
      ((char.hometown || "").trim() ? "  ·  " + char.hometown.trim() : "");
    var sc = document.getElementById("f-sign");
    if (sc) sc.textContent = sign;
  }

  function markUnsaved() { document.getElementById("save-state").textContent = "Unsaved changes"; }
  function refresh() { paintStage(); refreshDirs(); refreshPlate(); markUnsaved(); }

  var audio = null;
  function speak() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { return; }
    var base = 175 + char.voice * 48;
    [0, 3, -2, 1, 4, 0, -1].forEach(function (stepN, i) {
      var t = audio.currentTime + i * 0.085;
      var osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(base * Math.pow(2, stepN / 12), t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.072);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start(t); osc.stop(t + 0.085);
    });
  }

  function localSave() { try { localStorage.setItem("cozy-character-v3", JSON.stringify(char)); } catch (e) { /* blocked storage */ } }
  function save() {
    localSave();
    var el = document.getElementById("save-state");
    if (!docRef) { el.textContent = "Saved on this device"; return; }
    el.textContent = "Saving…";
    docRef.set({ character: char, updatedAt: Date.now() })
      .then(function () { el.textContent = "Saved ✓"; })
      .catch(function () { el.textContent = "Saved on this device only"; });
  }

  function setWalking(on) {
    walking = on;
    var btn = document.getElementById("walk-btn");
    btn.setAttribute("aria-pressed", String(on));
    btn.textContent = on ? "Stand still" : "Walk";
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(function () { frame = (frame + 1) % 4; paintStage(); }, 165);
    else { frame = 0; paintStage(); }
  }

  /* ---------- boot ---------- */

  try {
    var saved = localStorage.getItem("cozy-character-v3") || localStorage.getItem("cozy-character-v2");
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        char = Object.assign(S.defaultChar(), parsed);
        if (!Array.isArray(char.accessories)) char.accessories = [];
      }
    }
  } catch (e) { /* ignore */ }

  buildDirs();
  buildStepNav();
  goto(0);
  paintStage();
  refreshDirs();
  refreshPlate();

  document.getElementById("prev-btn").addEventListener("click", function () { goto(step - 1); });
  document.getElementById("next-btn").addEventListener("click", function () { goto(step + 1); });
  document.getElementById("walk-btn").addEventListener("click", function () { setWalking(!walking); });
  document.getElementById("save-btn").addEventListener("click", save);
  document.getElementById("roll-btn").addEventListener("click", function () {
    var keepName = char.name, keepTown = char.hometown;
    char = S.randomChar();
    char.name = keepName; char.hometown = keepTown;
    refresh(); renderStep();
  });

  if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) setWalking(true);

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (handle) {
      if (!handle) return;
      docRef = handle.doc("characters/player");
      return docRef.get().then(function (snap) {
        if (snap && snap.exists) {
          var data = snap.data();
          if (data && data.character) {
            char = Object.assign(S.defaultChar(), data.character);
            if (!Array.isArray(char.accessories)) char.accessories = [];
            paintStage(); refreshDirs(); refreshPlate(); renderStep();
            document.getElementById("save-state").textContent = "Saved ✓";
          }
        }
      });
    }).catch(function () { /* stays local */ });
  }
})();
</script>
