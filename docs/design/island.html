<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Morning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --sky: #dff0ec; --paper: #fffdf5; --sunk: #ecf4ec;
    --line: #c7ded3; --line-2: #a9cdbe;
    --ink: #16322e; --ink-soft: #5d7d75;
    --sea: #12857c; --marigold: #f2a516; --coral: #ef6f52; --leaf: #5aa845;
    --glow: rgba(242, 165, 22, .3);
    --body: "Karla", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #10211f; --paper: #18312d; --sunk: #122420;
      --line: #27443e; --line-2: #386057;
      --ink: #eef7f2; --ink-soft: #8fb0a8;
      --sea: #45c4b5; --marigold: #ffbc3c; --glow: rgba(255, 188, 60, .26);
    }
  }
  :root[data-theme="dark"] {
    --sky: #10211f; --paper: #18312d; --sunk: #122420;
    --line: #27443e; --line-2: #386057;
    --ink: #eef7f2; --ink-soft: #8fb0a8;
    --sea: #45c4b5; --marigold: #ffbc3c; --glow: rgba(255, 188, 60, .26);
  }

  * { box-sizing: border-box; }
  html { background: var(--sky); }
  body {
    margin: 0; min-height: 100dvh; background: var(--sky); color: var(--ink);
    font-family: var(--body); font-size: 15px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px;
    overscroll-behavior: none;
  }
  canvas { image-rendering: pixelated; display: block; }
  .px { line-height: 0; }

  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; width: 100%; max-width: 960px; }
  .kicker { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--marigold); }

  .frame {
    position: relative; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden;
    box-shadow: 0 2px 0 var(--line), 0 16px 30px -22px rgba(12, 50, 44, .6);
    background: #4f9fc4; touch-action: none; max-width: 100%;
  }
  .frame::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; z-index: 3;
    background: repeating-linear-gradient(90deg,
      var(--sea) 0 14px, var(--marigold) 14px 28px, var(--coral) 28px 42px, var(--leaf) 42px 56px);
    opacity: .85; pointer-events: none;
  }

  .hint { color: var(--ink-soft); font-size: 12.5px; text-align: center; max-width: 60ch; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: var(--body); font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--sunk); color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 3px; padding: 9px 12px; display: inline-flex; align-items: center; gap: 7px;
  }
  .btn .px canvas { max-width: none; }
  @media (hover: hover) { .btn:hover { border-color: var(--marigold); box-shadow: 0 0 0 1px var(--glow); } }

  /* The thumb pad. Only on a touch screen — a d-pad on a desktop is clutter,
     and the arrow keys are right there. */
  .pad { display: none; position: absolute; left: 10px; bottom: 10px; z-index: 2;
    width: 132px; height: 132px; opacity: .8; }
  .pad button {
    position: absolute; width: 44px; height: 44px; border-radius: 6px; border: 1px solid rgba(0,0,0,.25);
    background: rgba(255,253,245,.78); color: #16322e; font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .pad button:active { background: var(--marigold); }
  .pad .u { left: 44px; top: 0; } .pad .d { left: 44px; top: 88px; }
  .pad .l { left: 0; top: 44px; }  .pad .r { left: 88px; top: 44px; }
  @media (pointer: coarse) { .pad { display: block; } }

  :focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
</style>

<div class="head">
  <div>
    <p class="kicker" style="margin:0 0 4px">Build 0.8 &middot; the island</p>
    <div class="px" id="wordmark">Island morning</div>
  </div>
</div>

<div class="frame" id="frame">
  <canvas id="view" width="416" height="320" aria-label="The island"></canvas>
  <div class="pad" id="pad" role="group" aria-label="Move">
    <button class="u" type="button" data-dir="up" aria-label="Up">&#9650;</button>
    <button class="l" type="button" data-dir="left" aria-label="Left">&#9664;</button>
    <button class="r" type="button" data-dir="right" aria-label="Right">&#9654;</button>
    <button class="d" type="button" data-dir="down" aria-label="Down">&#9660;</button>
  </div>
</div>

<p class="hint" id="hint">Arrow keys or WASD to walk. On a phone, drag anywhere on the island or use the pad.</p>
<div class="bar">
  <button class="btn" id="edit-btn" type="button"><span class="px">Change how I look</span></button>
</div>

<script src="sprite.js"></script>
<script src="type.js"></script>
<script src="ground.js"></script>
<script src="props.js"></script>
<script src="map.js"></script>
<script>
(function () {
  "use strict";
  var S = window.CozySprite, T = window.CozyType;
  var G = window.CozyGround, P = window.CozyProps, M = window.CozyMap;
  var TILE = G.T;

  var CSS = getComputedStyle(document.documentElement);
  var INK = CSS.getPropertyValue("--ink").trim() || "#16322e";
  var SEA = CSS.getPropertyValue("--sea").trim() || "#12857c";
  var SHADOW = CSS.getPropertyValue("--line-2").trim() || "#a9cdbe";

  /* ---------------------------------------------------------- who you are --- */

  var who = S.defaultChar();
  try {
    var saved = localStorage.getItem("cozy-character-v4") || localStorage.getItem("cozy-character-v3");
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        who = Object.assign(S.defaultChar(), parsed);
        if (!Array.isArray(who.accessories)) who.accessories = [];
      }
    }
  } catch (e) { /* the default islander will do */ }

  /* ------------------------------------------------------------ the world --- */

  var map = M.home();

  /** Turn a pixel surface into a canvas once, so the frame loop only blits. */
  function bake(surface) {
    var c = document.createElement("canvas");
    c.width = surface.w; c.height = surface.h;
    var img = c.getContext("2d").createImageData(surface.w, surface.h);
    for (var i = 0; i < surface.px.length; i++) {
      var col = surface.px[i];
      if (!col) continue;
      var n = parseInt(col.slice(1), 16);
      img.data[i * 4] = (n >> 16) & 255;
      img.data[i * 4 + 1] = (n >> 8) & 255;
      img.data[i * 4 + 2] = n & 255;
      img.data[i * 4 + 3] = 255;
    }
    c.getContext("2d").putImageData(img, 0, 0);
    return c;
  }

  /* The ground is painted once, with every prop's shadow cast onto it. A
   * shadow belongs to the ground rather than to the thing above it: cached
   * with the prop it would be a grey smear carried around on the prop's own
   * transparent background. */
  /* Three things move, and none of them at the same pace. The waterline
   * breathes on twelve frames, the trees lean on twenty-four, and the light
   * on the water does not step at all — it slides. */
  var SEA_FRAMES = G.FRAMES, LEAF_FRAMES = P.FRAMES;
  var TIDE_MS = 450, LEAF_MS = 1800;

  function paintFrame(n) {
    var surface = G.paintGround(map, n);
    var shade = P.shadowMask(surface.w, surface.h);
    map.props.forEach(function (p) {
      P.castShadow(shade, p.kind, p.tx * TILE + p.jx, p.ty * TILE + p.jy, p.link);
    });
    P.paintShadows(surface, shade);
    return surface;
  }

  var groundSurface = paintFrame(0);
  var groundCanvas = bake(groundSurface);

  /* The tide. Only the waterline moves — forty pixels of the island — so the
   * island is painted once and each moment of the tide is a band that is
   * stamped over it. Painting the whole map a dozen times to animate that
   * band was most of what this page spent its first three seconds doing. */
  var tide = [];
  for (var fr = 0; fr < SEA_FRAMES; fr++) {
    var sh = G.paintShore(map, fr);
    if (!sh) { tide.push(null); continue; }
    /* The shadows that fall across the waterline have to be cast onto the
     * band as well, or stamping it would rub them out. */
    var band = P.shadowMask(sh.s.w, sh.s.h);
    map.props.forEach(function (p) {
      P.castShadow(band, p.kind, p.tx * TILE + p.jx, p.ty * TILE + p.jy - sh.y, p.link);
    });
    P.paintShadows(sh.s, band);
    tide.push({ c: bake(sh.s), y: sh.y });
  }

  /* The sea itself. The light on the water is a strip as wide as its own
   * repeat, drawn over the water and slid sideways a pixel at a time: it
   * leaves the right-hand edge exactly as it enters the left, so it runs one
   * way for ever. Baked into the map instead, a sea that drifts one way has
   * to snap back at the end of its cycle, which is why it used to swell back
   * and forth instead. */
  var water = (function () {
    var rects = [], y0 = 1e9, y1 = -1;
    for (var ty = 0; ty < map.h; ty++) {
      for (var tx = 0; tx < map.w; tx++) {
        if (map.ground[ty * map.w + tx] !== "water") continue;
        /* Stop short of the waterline: the sand creeps up into the last few
         * pixels of the sea, and a streak of light landing on the beach is
         * not light on water. */
        var below = ty + 1 >= map.h ? (map.edge || "water")
                                    : map.ground[(ty + 1) * map.w + tx];
        var h = below === "water" ? TILE : TILE - 14;
        if (h <= 0) continue;
        rects.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: h });
        if (ty * TILE < y0) y0 = ty * TILE;
        if (ty * TILE + h > y1) y1 = ty * TILE + h;
      }
    }
    return rects.length ? { rects: rects, y: y0, h: y1 - y0 } : null;
  })();
  var seaCanvas = water ? bake(G.seaStrip(water.h)) : null;

  /* Each prop is drawn once into its own little canvas and then stamped. A
   * tree is a few thousand pixels of loops; doing that sixty times a second
   * for thirty of them is work nobody needs to do twice. */
  var propCanvas = {};
  map.props.forEach(function (p) {
    /* One picture per look, not per prop: every plain fence post shares a
     * canvas, and only a different seed or a different set of rails makes a
     * new one. Anything that sways gets one picture per frame of the sway;
     * everything else gets one and shows it for all four. */
    var def = P.PROPS[p.kind];
    var base = p.kind + ":" + p.seed +
      (p.link ? ":" + [p.link.left, p.link.right, p.link.up, p.link.down].join("") : "");
    p.key = base;
    /* Every tree on its own CLOCK, not merely its own frame — and the clocks
     * are spread EVENLY around the cycle rather than at random. Offsets
     * drawn from where each one stands landed in clumps: three of them
     * leaning within half a second of each other and then nothing for four,
     * which is precisely what the eye reads as "they all moved together".
     * The order comes from the map, so it is the same tree on the same beat
     * every time the page opens, and the jitter keeps the spacing itself
     * from becoming a rhythm. Set below, once the movers are counted. */
    p.moves = !!def.sway;
    for (var ph = 0; ph < (def.sway ? LEAF_FRAMES : 1); ph++) {
      var key = base + "@" + ph;
      if (propCanvas[key]) continue;
      var b = P.bounds(p.kind);
      var s = new G.Surface(b.w, b.h);
      def.draw(s, -b.x, -b.y, p.seed, p.link, ph);
      propCanvas[key] = { c: bake(s), dx: b.x, dy: b.y };
    }
  });
  (function () {
    var movers = map.props.filter(function (p) { return p.moves; });
    var span = LEAF_FRAMES * LEAF_MS;
    movers.forEach(function (p, i) {
      /* Work backwards from WHEN IT SHOULD LEAN. Spacing the clocks evenly
       * is not the same thing: a palm leans at a different point of its
       * cycle from a broadleaf, so evenly spaced clocks still put two of
       * them over on the same second. */
      var want = (i + G.hash(p.tx, p.ty, 88) * 0.4) / movers.length * span;
      var lean = P.leanAt(P.PROPS[p.kind].sway) * LEAF_MS;
      p.offset = ((lean - want) % span + span) % span;
    });
  })();

  /* Sixteen pictures of you: four ways to face, four frames of the walk.
   * Nothing about the character changes while you are walking about, so
   * rebuilding the sprite every frame would be sixty rebuilds a second of a
   * picture that never changes. */
  var meCanvas = {};
  function rebuildMe() {
    meCanvas = {};
    ["down", "left", "right", "up"].forEach(function (d) {
      for (var f = 0; f < 4; f++) {
        var g = S.build(who, d, f);
        var s = new G.Surface(S.W, S.H);
        s.px = g.px.slice();
        meCanvas[d + f] = bake(s);
      }
    });
  }
  rebuildMe();

  /* --------------------------------------------------------------- moving --- */

  /* You are a point on the ground with a small box around your feet — the
   * stance, not the whole character. The box, and what it may stand on, live
   * with the map, so the game and its tests are asking the same question. */
  var me = { x: map.spawn.x, y: map.spawn.y, dir: "down", frame: 0, step: 0, moving: false };
  window.__me = me;                      /* so the walk can be driven from a test */
  /* The walk cycle is four frames, and the sprite moves a planted foot
   * S.STRIDE pixels back under the body between one and the next. So the
   * island may scroll past by exactly that much per frame and not a pixel
   * more, or the feet skate. Speed is then a choice about how briskly the
   * legs go round, not a free number. */
  var SPEED = S.STRIDE * 7.5;                       /* pixels a second */

  function footClear(x, y) { return M.canStand(map, x, y); }

  var held = {};
  function axis() {
    var dx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    var dy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
    /* Four directions, not eight. If both axes are pushed, the one you
     * started pushing later wins, so a corner feels like a turn rather than
     * a diagonal slide the character cannot face. */
    if (dx && dy) { if (held.lastAxis === "x") dy = 0; else dx = 0; }
    return { dx: dx, dy: dy };
  }

  function press(d, on) {
    if (on && (d === "left" || d === "right")) held.lastAxis = "x";
    if (on && (d === "up" || d === "down")) held.lastAxis = "y";
    held[d] = on;
  }

  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  window.addEventListener("keydown", function (e) {
    var d = KEYS[e.key];
    if (!d) return;
    press(d, true);
    e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var d = KEYS[e.key];
    if (d) press(d, false);
  });
  window.addEventListener("blur", function () { held = {}; });

  document.querySelectorAll("#pad button").forEach(function (b) {
    var d = b.dataset.dir;
    ["pointerdown", "pointerenter"].forEach(function (ev) {
      b.addEventListener(ev, function (e) { if (ev === "pointerdown" || e.buttons) { press(d, true); e.preventDefault(); } });
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
      b.addEventListener(ev, function () { press(d, false); });
    });
  });

  /* Drag anywhere on the island: the direction is from where your thumb went
   * down to where it is now, snapped to the nearest quarter. */
  var frameEl = document.getElementById("frame");
  var touchFrom = null;
  frameEl.addEventListener("pointerdown", function (e) {
    if (e.target.closest("#pad")) return;
    touchFrom = { x: e.clientX, y: e.clientY };
    frameEl.setPointerCapture(e.pointerId);
  });
  frameEl.addEventListener("pointermove", function (e) {
    if (!touchFrom) return;
    var dx = e.clientX - touchFrom.x, dy = e.clientY - touchFrom.y;
    var far = Math.max(Math.abs(dx), Math.abs(dy));
    held.left = held.right = held.up = held.down = false;
    if (far < 8) return;
    if (Math.abs(dx) > Math.abs(dy)) press(dx > 0 ? "right" : "left", true);
    else press(dy > 0 ? "down" : "up", true);
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    frameEl.addEventListener(ev, function () {
      touchFrom = null;
      held.left = held.right = held.up = held.down = false;
    });
  });

  /* -------------------------------------------------------------- drawing --- */

  /* Nothing on the island shares a clock. The light on the water slides a
   * pixel at a time, the waterline breathes on twelve frames, and every tree
   * leans on twenty-four of its own — offset from its neighbours by a
   * fraction of a second, so the field is weather rather than a metronome. */
  var now = 0;

  var view = document.getElementById("view");
  var ctx = view.getContext("2d");
  /* The view is smaller than the island and the camera follows you. Showing
   * the whole map at once put you at arm's length from it; a cozy game wants
   * you down among the grass. */
  var CAM = { w: 416, h: 320 };

  function fit() {
    /* An integer scale, always: half a pixel of a pixel is a smear. */
    var avail = Math.min(window.innerWidth - 26, 1240);
    var tall = window.innerHeight - 190;
    var k = Math.max(1, Math.min(3, Math.floor(avail / CAM.w), Math.floor(tall / CAM.h)));
    view.style.width = (CAM.w * k) + "px";
    view.style.height = (CAM.h * k) + "px";
  }
  window.addEventListener("resize", fit);

  function camera() {
    var cx = me.x - CAM.w / 2, cy = me.y - CAM.h / 2;
    /* Clamped to the map, so you never see past the edge of the world. When
     * the map is smaller than the view it is centred instead. */
    var maxX = map.w * TILE - CAM.w, maxY = map.h * TILE - CAM.h;
    cx = maxX <= 0 ? maxX / 2 : Math.max(0, Math.min(maxX, cx));
    cy = maxY <= 0 ? maxY / 2 : Math.max(0, Math.min(maxY, cy));
    return { x: Math.round(cx), y: Math.round(cy) };
  }

  /** The light on the water, slid sideways and clipped to the sea. */
  function drawSea(cam) {
    if (!water) return;
    var L = G.SEA.strip;
    var off = Math.floor(now / 1000 * G.SEA.speed) % L;
    ctx.save();
    ctx.beginPath();
    water.rects.forEach(function (r) {
      ctx.rect(r.x - cam.x, r.y - cam.y, r.w, r.h);
    });
    ctx.clip();
    for (var x = -off; x < map.w * TILE; x += L) {
      ctx.drawImage(seaCanvas, x - cam.x, water.y - cam.y);
    }
    ctx.restore();
  }

  function paint() {
    var cam = camera();
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, CAM.w, CAM.h);
    ctx.drawImage(groundCanvas, -cam.x, -cam.y);
    var wash = tide[Math.floor(now / TIDE_MS) % SEA_FRAMES];
    if (wash) ctx.drawImage(wash.c, -cam.x, wash.y - cam.y);
    drawSea(cam);

    /* Everything standing on the ground, drawn in order of how far down the
     * screen its feet are. That one rule is what lets you walk behind a tree
     * and in front of its trunk. */
    var standing = map.props.map(function (p) {
      return { foot: (p.ty + P.PROPS[p.kind].h) * TILE, p: p };
    });
    standing.push({ foot: me.y, me: true });
    standing.sort(function (a, b) { return a.foot - b.foot; });

    standing.forEach(function (it) {
      if (it.me) {
        /* your own shadow, cast fresh because you move */
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#0d2a1e";
        var sx = Math.round(me.x - cam.x), sy = Math.round(me.y - cam.y);
        ctx.beginPath();
        ctx.ellipse(sx, sy - 2, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        var img = meCanvas[me.dir + me.frame];
        /* The sprite is pinned by the row its feet stand on, which the
         * sprite itself publishes — it moved when the character was made
         * shorter, and a number copied here would have left them wading. */
        ctx.drawImage(img, sx - S.MIDX, sy - S.SOLE);
        return;
      }
      var art = propCanvas[it.p.key + "@" +
        (it.p.moves ? Math.floor((now + it.p.offset) / LEAF_MS) % LEAF_FRAMES : 0)];
      ctx.drawImage(art.c, it.p.tx * TILE + it.p.jx + art.dx - cam.x,
                           it.p.ty * TILE + it.p.jy + art.dy - cam.y);
    });
  }

  /* ----------------------------------------------------------------- loop --- */

  var last = 0;
  function tick(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    now = t;
    var a = axis();
    me.moving = !!(a.dx || a.dy);
    if (me.moving) {
      me.dir = a.dx ? (a.dx > 0 ? "right" : "left") : (a.dy > 0 ? "down" : "up");
      var step = SPEED * dt;
      /* Each axis on its own, so running along a fence slides rather than
       * stopping dead the moment one axis is blocked. */
      if (a.dx && footClear(me.x + a.dx * step, me.y)) me.x += a.dx * step;
      if (a.dy && footClear(me.x, me.y + a.dy * step)) me.y += a.dy * step;
      /* The walk cycle runs on distance covered, not on time, so it never
       * looks like the feet are skating. */
      me.step += step;
      me.frame = Math.floor(me.step / S.STRIDE) % 4;
    } else {
      me.step = 0; me.frame = 0;
    }
    paint();
    requestAnimationFrame(tick);
  }

  /* ----------------------------------------------------------------- chrome --- */

  T.apply(document.getElementById("wordmark"), { scale: 4, color: SEA, shadow: SHADOW, tracking: 1 });
  document.querySelectorAll(".btn .px").forEach(function (el) {
    T.apply(el, { scale: 2, color: INK, tracking: 1 });
  });
  document.getElementById("edit-btn").addEventListener("click", function () {
    window.location.href = "index.html";
  });

  fit();
  requestAnimationFrame(tick);

  /* If the creator saved you into the artifact's own store, prefer that. */
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (handle) {
      if (!handle) return;
      return handle.doc("characters/player").get().then(function (snap) {
        if (snap && snap.exists) {
          var data = snap.data();
          if (data && data.character) {
            who = Object.assign(S.defaultChar(), data.character);
            if (!Array.isArray(who.accessories)) who.accessories = [];
            rebuildMe();
          }
        }
      });
    }).catch(function () { /* the local copy stands */ });
  }
})();
</script>
