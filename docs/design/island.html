<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Morning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --sky: #dff0ec; --paper: #fffdf5; --sunk: #ecf4ec;
    --line: #c7ded3; --line-2: #a9cdbe;
    --ink: #16322e; --ink-soft: #5d7d75;
    --sea: #12857c; --marigold: #f2a516; --coral: #ef6f52; --leaf: #5aa845;
    --glow: rgba(242, 165, 22, .3);
    --body: "Karla", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #10211f; --paper: #18312d; --sunk: #122420;
      --line: #27443e; --line-2: #386057;
      --ink: #eef7f2; --ink-soft: #8fb0a8;
      --sea: #45c4b5; --marigold: #ffbc3c; --glow: rgba(255, 188, 60, .26);
    }
  }
  :root[data-theme="dark"] {
    --sky: #10211f; --paper: #18312d; --sunk: #122420;
    --line: #27443e; --line-2: #386057;
    --ink: #eef7f2; --ink-soft: #8fb0a8;
    --sea: #45c4b5; --marigold: #ffbc3c; --glow: rgba(255, 188, 60, .26);
  }

  * { box-sizing: border-box; }
  html { background: var(--sky); }
  body {
    margin: 0; min-height: 100dvh; background: var(--sky); color: var(--ink);
    font-family: var(--body); font-size: 15px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px;
    overscroll-behavior: none;
  }
  canvas { image-rendering: pixelated; display: block; }
  .px { line-height: 0; }

  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; width: 100%; max-width: 960px; }
  .kicker { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--marigold); }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .clock {
    margin: 0 0 0 auto; color: var(--ink-soft); font-size: 12.5px;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }

  .frame {
    position: relative; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden;
    box-shadow: 0 2px 0 var(--line), 0 16px 30px -22px rgba(12, 50, 44, .6);
    background: #4f9fc4; touch-action: none; max-width: 100%;
  }
  .frame::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; z-index: 3;
    background: repeating-linear-gradient(90deg,
      var(--sea) 0 14px, var(--marigold) 14px 28px, var(--coral) 28px 42px, var(--leaf) 42px 56px);
    opacity: .85; pointer-events: none;
  }

  .hint { color: var(--ink-soft); font-size: 12.5px; text-align: center; max-width: 60ch; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: var(--body); font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--sunk); color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 3px; padding: 9px 12px; display: inline-flex; align-items: center; gap: 7px;
  }
  .btn .px canvas { max-width: none; }
  @media (hover: hover) { .btn:hover { border-color: var(--marigold); box-shadow: 0 0 0 1px var(--glow); } }

  /* The thumb pad. Only on a touch screen — a d-pad on a desktop is clutter,
     and the arrow keys are right there. */
  .pad { display: none; position: absolute; left: 10px; bottom: 10px; z-index: 2;
    width: 132px; height: 132px; opacity: .8; }
  .pad button {
    position: absolute; width: 44px; height: 44px; border-radius: 6px; border: 1px solid rgba(0,0,0,.25);
    background: rgba(255,253,245,.78); color: #16322e; font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .pad button:active { background: var(--marigold); }
  .pad .u { left: 44px; top: 0; } .pad .d { left: 44px; top: 88px; }
  .pad .l { left: 0; top: 44px; }  .pad .r { left: 88px; top: 44px; }
  @media (pointer: coarse) { .pad { display: block; } }

  :focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
</style>

<div class="head">
  <div>
    <p class="kicker" style="margin:0 0 4px">Build 0.8 &middot; the island</p>
    <div class="px" id="wordmark">Island morning</div>
  </div>
  <p class="clock" id="clock" aria-live="off">&nbsp;</p>
</div>

<div class="frame" id="frame">
  <canvas id="view" width="416" height="320" aria-label="The island"></canvas>
  <div class="pad" id="pad" role="group" aria-label="Move">
    <button class="u" type="button" data-dir="up" aria-label="Up">&#9650;</button>
    <button class="l" type="button" data-dir="left" aria-label="Left">&#9664;</button>
    <button class="r" type="button" data-dir="right" aria-label="Right">&#9654;</button>
    <button class="d" type="button" data-dir="down" aria-label="Down">&#9660;</button>
  </div>
</div>

<p class="hint" id="hint">Arrow keys or WASD to walk. On a phone, drag anywhere on the island or use the pad.</p>
<div class="bar">
  <button class="btn" id="talk-btn" type="button" hidden><span class="px"></span></button>
  <button class="btn" id="edit-btn" type="button"><span class="px">Change how I look</span></button>
</div>

<script src="sprite.js"></script>
<script src="villagers.js"></script>
<script src="type.js"></script>
<script src="ground.js"></script>
<script src="props.js"></script>
<script src="map.js"></script>
<script src="sky.js"></script>
<script>
(function () {
  "use strict";
  var S = window.CozySprite, T = window.CozyType;
  var G = window.CozyGround, P = window.CozyProps, M = window.CozyMap;
  var K = window.CozySky;
  var V = window.CozyVillagers;
  var TILE = G.T;

  var CSS = getComputedStyle(document.documentElement);
  var INK = CSS.getPropertyValue("--ink").trim() || "#16322e";
  var SEA = CSS.getPropertyValue("--sea").trim() || "#12857c";
  var SHADOW = CSS.getPropertyValue("--line-2").trim() || "#a9cdbe";

  /* ---------------------------------------------------------- who you are --- */

  var who = S.defaultChar();
  try {
    var saved = localStorage.getItem("cozy-character-v4") || localStorage.getItem("cozy-character-v3");
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object") {
        who = Object.assign(S.defaultChar(), parsed);
        if (!Array.isArray(who.accessories)) who.accessories = [];
      }
    }
  } catch (e) { /* the default islander will do */ }

  /* ------------------------------------------------------------ the world --- */

  var map = M.home();

  /** Turn a pixel surface into a canvas once, so the frame loop only blits. */
  function bake(surface) {
    var c = document.createElement("canvas");
    c.width = surface.w; c.height = surface.h;
    var img = c.getContext("2d").createImageData(surface.w, surface.h);
    for (var i = 0; i < surface.px.length; i++) {
      var col = surface.px[i];
      if (!col) continue;
      var n = parseInt(col.slice(1), 16);
      img.data[i * 4] = (n >> 16) & 255;
      img.data[i * 4 + 1] = (n >> 8) & 255;
      img.data[i * 4 + 2] = n & 255;
      img.data[i * 4 + 3] = 255;
    }
    c.getContext("2d").putImageData(img, 0, 0);
    return c;
  }

  /* The ground is painted once, with every prop's shadow cast onto it. A
   * shadow belongs to the ground rather than to the thing above it: cached
   * with the prop it would be a grey smear carried around on the prop's own
   * transparent background. */
  /* Three things move, and none of them at the same pace. The waterline
   * breathes on twelve frames, the trees lean on twenty-four, and the light
   * on the water does not step at all — it slides. */
  var SEA_FRAMES = G.FRAMES, LEAF_FRAMES = P.FRAMES;
  var TIDE_MS = 450, LEAF_MS = 1800;

  function paintFrame(n) {
    var surface = G.paintGround(map, n);
    var shade = P.shadowMask(surface.w, surface.h);
    map.props.forEach(function (p) {
      P.castShadow(shade, p.kind, p.tx * TILE + p.jx, p.ty * TILE + p.jy, p.link);
    });
    P.paintShadows(surface, shade);
    return surface;
  }

  var groundSurface = paintFrame(0);
  var groundCanvas = bake(groundSurface);

  /* The tide. Only the waterline moves — forty pixels of the island — so the
   * island is painted once and each moment of the tide is a band that is
   * stamped over it. Painting the whole map a dozen times to animate that
   * band was most of what this page spent its first three seconds doing. */
  var tide = [];
  for (var fr = 0; fr < SEA_FRAMES; fr++) {
    var sh = G.paintShore(map, fr);
    if (!sh) { tide.push(null); continue; }
    /* The shadows that fall across the waterline have to be cast onto the
     * band as well, or stamping it would rub them out. */
    var band = P.shadowMask(sh.s.w, sh.s.h);
    map.props.forEach(function (p) {
      P.castShadow(band, p.kind, p.tx * TILE + p.jx, p.ty * TILE + p.jy - sh.y, p.link);
    });
    P.paintShadows(sh.s, band);
    tide.push({ c: bake(sh.s), y: sh.y });
  }

  /* The sea itself. The light on the water is a strip as wide as its own
   * repeat, drawn over the water and slid sideways a pixel at a time: it
   * leaves the right-hand edge exactly as it enters the left, so it runs one
   * way for ever. Baked into the map instead, a sea that drifts one way has
   * to snap back at the end of its cycle, which is why it used to swell back
   * and forth instead. */
  var water = (function () {
    var rects = [], y0 = 1e9, y1 = -1;
    for (var ty = 0; ty < map.h; ty++) {
      for (var tx = 0; tx < map.w; tx++) {
        if (map.ground[ty * map.w + tx] !== "water") continue;
        /* Stop short of the waterline: the sand creeps up into the last few
         * pixels of the sea, and a streak of light landing on the beach is
         * not light on water. */
        var below = ty + 1 >= map.h ? (map.edge || "water")
                                    : map.ground[(ty + 1) * map.w + tx];
        var h = below === "water" ? TILE : TILE - 14;
        if (h <= 0) continue;
        rects.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: h });
        if (ty * TILE < y0) y0 = ty * TILE;
        if (ty * TILE + h > y1) y1 = ty * TILE + h;
      }
    }
    return rects.length ? { rects: rects, y: y0, h: y1 - y0 } : null;
  })();
  var seaCanvas = water ? bake(G.seaStrip(water.h)) : null;

  /* Each prop is drawn once into its own little canvas and then stamped. A
   * tree is a few thousand pixels of loops; doing that sixty times a second
   * for thirty of them is work nobody needs to do twice. */
  var propCanvas = {};
  map.props.forEach(function (p) {
    /* One picture per look, not per prop: every plain fence post shares a
     * canvas, and only a different seed or a different set of rails makes a
     * new one. Anything that sways gets one picture per frame of the sway;
     * everything else gets one and shows it for all four. */
    var def = P.PROPS[p.kind];
    var base = p.kind + ":" + p.seed +
      (p.link ? ":" + [p.link.left, p.link.right, p.link.up, p.link.down].join("") : "");
    p.key = base;
    /* Every tree on its own CLOCK, not merely its own frame — and the clocks
     * are spread EVENLY around the cycle rather than at random. Offsets
     * drawn from where each one stands landed in clumps: three of them
     * leaning within half a second of each other and then nothing for four,
     * which is precisely what the eye reads as "they all moved together".
     * The order comes from the map, so it is the same tree on the same beat
     * every time the page opens, and the jitter keeps the spacing itself
     * from becoming a rhythm. Set below, once the movers are counted. */
    p.moves = !!def.sway;
    for (var ph = 0; ph < (def.sway ? LEAF_FRAMES : 1); ph++) {
      var key = base + "@" + ph;
      if (propCanvas[key]) continue;
      var b = P.bounds(p.kind);
      var s = new G.Surface(b.w, b.h);
      def.draw(s, -b.x, -b.y, p.seed, p.link, ph);
      propCanvas[key] = { c: bake(s), dx: b.x, dy: b.y };
    }
  });
  (function () {
    var movers = map.props.filter(function (p) { return p.moves; });
    var span = LEAF_FRAMES * LEAF_MS;
    movers.forEach(function (p, i) {
      /* Work backwards from WHEN IT SHOULD LEAN. Spacing the clocks evenly
       * is not the same thing: a palm leans at a different point of its
       * cycle from a broadleaf, so evenly spaced clocks still put two of
       * them over on the same second. */
      var want = (i + G.hash(p.tx, p.ty, 88) * 0.4) / movers.length * span;
      var lean = P.leanAt(P.PROPS[p.kind].sway) * LEAF_MS;
      p.offset = ((lean - want) % span + span) % span;
    });
  })();

  /* Sixteen pictures of you: four ways to face, four frames of the walk.
   * Nothing about the character changes while you are walking about, so
   * rebuilding the sprite every frame would be sixty rebuilds a second of a
   * picture that never changes. */
  var meCanvas = {};
  function rebuildMe() {
    meCanvas = {};
    ["down", "left", "right", "up"].forEach(function (d) {
      for (var f = 0; f < 4; f++) {
        var g = S.build(who, d, f);
        var s = new G.Surface(S.W, S.H);
        s.px = g.px.slice();
        meCanvas[d + f] = bake(s);
      }
    });
  }
  rebuildMe();


  /* ------------------------------------------------------- the neighbours --- */

  /* Three of the twenty-four, actually out on the island.
   *
   * Each keeps to their own ground. Marlow belongs on the sand and the other
   * two on the grass, and that one rule does the work a path-finder would
   * otherwise have to: nobody wanders into the sea, through the garden gate
   * or up onto the path, and each of them stays somewhere that suits them
   * without anyone drawing a box round it by hand.
   *
   * They amble rather than patrol. A neighbour picks somewhere within a few
   * tiles of their own spot, walks there, and then stands about for a while
   * — and the standing about is most of it. Something that never stops
   * moving reads as a machine on a track; the pauses are what make it look
   * like somebody deciding to go and look at the water. */
  var TALK_R = 34;                  /* how close before you can say hello */
  var WHERE = {
    Marlow:     { at: [4.5, 3.4],  roam: 74 },
    Nkechi:     { at: [3.5, 8.6],  roam: 58 },
    Marguerite: { at: [13.0, 8.6], roam: 58 }
  };

  var folk = V.roster(S.defaultChar(0))
    .filter(function (v) { return WHERE[v.name]; })
    .map(function (v) {
      var w = WHERE[v.name];
      var p = {
        who: v, name: v.name, haunt: v.haunt, roam: w.roam,
        hx: w.at[0] * TILE, hy: w.at[1] * TILE,
        dir: "down", frame: 0, step: 0, wait: 0.8 + Math.random() * 2.5,
        target: null, art: {}
      };
      p.x = p.hx; p.y = p.hy;
      ["down", "left", "right", "up"].forEach(function (d) {
        for (var f = 0; f < 4; f++) {
          var g = S.build(v.record, d, f);
          var sf = new G.Surface(S.W, S.H);
          sf.px = g.px.slice();
          p.art[d + f] = bake(sf);
        }
      });
      return p;
    });
  window.__folk = folk;             /* so a test can watch them wander */

  /** The ground under a pair of feet, by name. */
  function groundAt(x, y) {
    var tx = Math.floor(x / TILE), ty = Math.floor((y - 1) / TILE);
    if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return null;
    return map.ground[ty * map.w + tx];
  }

  /** Nobody stands inside anybody else. */
  function folkClear(x, y, mine) {
    for (var i = 0; i < folk.length; i++) {
      var o = folk[i];
      if (o === mine) continue;
      if (Math.abs(o.x - x) < 14 && Math.abs(o.y - y) < 14) return false;
    }
    return true;
  }

  /** Can this neighbour put their feet here? */
  function folkMayStand(p, x, y) {
    return M.canStand(map, x, y) && groundAt(x, y) === p.haunt &&
      folkClear(x, y, p) && !(Math.abs(me.x - x) < 14 && Math.abs(me.y - y) < 10);
  }

  /* Somewhere to go, within reach of home and on their own ground. Tried a
   * handful of times and then given up on — a neighbour boxed into a corner
   * stands still for a moment rather than the loop hunting for ever. */
  function pickSpot(p) {
    for (var n = 0; n < 14; n++) {
      var a = Math.random() * Math.PI * 2, r = p.roam * Math.sqrt(Math.random());
      var x = p.hx + Math.cos(a) * r, y = p.hy + Math.sin(a) * r * 0.7;
      if (folkMayStand(p, x, y)) return { x: x, y: y };
    }
    return null;
  }

  /* Half your pace. They are not going anywhere.
   *
   * A RATIO and not a speed, deliberately: written as `SPEED * 0.45` up here
   * it was NaN, because SPEED is declared further down and this line runs at
   * load. Nothing complained — a NaN step asks the map whether you can stand
   * at NaN, which used to come back yes, so every neighbour cleared the spot
   * they were walking to on the first frame and stood still for ever. */
  var AMBLE = 0.45;

  function amble(p, dt) {
    /* Whoever you are talking to looks at you and stays put. */
    if (talking && talking.p === p) {
      p.target = null; p.step = 0; p.frame = 0;
      p.dir = Math.abs(me.x - p.x) > Math.abs(me.y - p.y)
        ? (me.x > p.x ? "right" : "left") : (me.y > p.y ? "down" : "up");
      return;
    }
    if (p.wait > 0) {
      p.wait -= dt; p.step = 0; p.frame = 0;
      if (p.wait <= 0) p.target = pickSpot(p);
      return;
    }
    if (!p.target) { p.wait = 1.5 + Math.random() * 4; return; }

    var dx = p.target.x - p.x, dy = p.target.y - p.y;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
      p.target = null;
      p.wait = 2 + Math.random() * 6;       /* stand about, which is the point */
      p.step = 0; p.frame = 0;
      return;
    }
    /* One axis at a time, the same as you: four ways to face and no
     * diagonal a sprite has no picture of. */
    var goX = Math.abs(dx) > Math.abs(dy);
    var step = SPEED * AMBLE * dt;
    var nx = p.x + (goX ? Math.sign(dx) * Math.min(step, Math.abs(dx)) : 0);
    var ny = p.y + (goX ? 0 : Math.sign(dy) * Math.min(step, Math.abs(dy)));
    if (folkMayStand(p, nx, ny)) {
      p.dir = goX ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      p.step += Math.abs(nx - p.x) + Math.abs(ny - p.y);
      p.x = nx; p.y = ny;
      p.frame = Math.floor(p.step / S.STRIDE) % 4;
    } else {
      /* Blocked — by the fence, by you, or by the edge of their own ground.
       * Rather than shuffle against it, think of somewhere else. */
      p.target = null;
      p.wait = 0.4 + Math.random() * 1.2;
      p.step = 0; p.frame = 0;
    }
  }

  /** The neighbour close enough to speak to, if there is one. */
  function whoIsNear() {
    var best = null, bestD = TALK_R * TALK_R;
    folk.forEach(function (p) {
      var dx = p.x - me.x, dy = p.y - me.y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = p; }
    });
    return best;
  }

  /* --------------------------------------------------------------- moving --- */

  /* You are a point on the ground with a small box around your feet — the
   * stance, not the whole character. The box, and what it may stand on, live
   * with the map, so the game and its tests are asking the same question. */
  var me = { x: map.spawn.x, y: map.spawn.y, dir: "down", frame: 0, step: 0, moving: false };
  window.__me = me;                      /* so the walk can be driven from a test */
  /* The walk cycle is four frames, and the sprite moves a planted foot
   * S.STRIDE pixels back under the body between one and the next. So the
   * island may scroll past by exactly that much per frame and not a pixel
   * more, or the feet skate. Speed is then a choice about how briskly the
   * legs go round, not a free number. */
  /* Ten walk frames a second. The number is a CADENCE, not a speed: the
   * sprite drags a planted foot S.STRIDE pixels back under the body between
   * one frame and the next, and the frame turns over every S.STRIDE pixels
   * travelled, so however fast they go the feet keep hold of the ground. All
   * this sets is how briskly the legs go round — seven and a half was a
   * stroll. */
  var SPEED = S.STRIDE * 10;                        /* pixels a second */

  /* You are stopped by a neighbour the same as by a fence post: walking
   * through somebody undoes every other bit of care taken over them. */
  function footClear(x, y) { return M.canStand(map, x, y) && folkClear(x, y, null); }

  var held = {};
  function axis() {
    var dx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    var dy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
    /* Four directions, not eight. If both axes are pushed, the one you
     * started pushing later wins, so a corner feels like a turn rather than
     * a diagonal slide the character cannot face. */
    if (dx && dy) { if (held.lastAxis === "x") dy = 0; else dx = 0; }
    return { dx: dx, dy: dy };
  }

  function press(d, on) {
    if (on && (d === "left" || d === "right")) held.lastAxis = "x";
    if (on && (d === "up" || d === "down")) held.lastAxis = "y";
    held[d] = on;
  }

  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  window.addEventListener("keydown", function (e) {
    var d = KEYS[e.key];
    if (!d) return;
    press(d, true);
    e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var d = KEYS[e.key];
    if (d) press(d, false);
  });
  window.addEventListener("blur", function () { held = {}; });

  document.querySelectorAll("#pad button").forEach(function (b) {
    var d = b.dataset.dir;
    ["pointerdown", "pointerenter"].forEach(function (ev) {
      b.addEventListener(ev, function (e) { if (ev === "pointerdown" || e.buttons) { press(d, true); e.preventDefault(); } });
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
      b.addEventListener(ev, function () { press(d, false); });
    });
  });

  /* Drag anywhere on the island: the direction is from where your thumb went
   * down to where it is now, snapped to the nearest quarter. */
  var frameEl = document.getElementById("frame");
  var touchFrom = null;
  frameEl.addEventListener("pointerdown", function (e) {
    if (e.target.closest("#pad")) return;
    touchFrom = { x: e.clientX, y: e.clientY };
    frameEl.setPointerCapture(e.pointerId);
  });
  frameEl.addEventListener("pointermove", function (e) {
    if (!touchFrom) return;
    var dx = e.clientX - touchFrom.x, dy = e.clientY - touchFrom.y;
    var far = Math.max(Math.abs(dx), Math.abs(dy));
    held.left = held.right = held.up = held.down = false;
    if (far < 8) return;
    if (Math.abs(dx) > Math.abs(dy)) press(dx > 0 ? "right" : "left", true);
    else press(dy > 0 ? "down" : "up", true);
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    frameEl.addEventListener(ev, function () {
      touchFrom = null;
      held.left = held.right = held.up = held.down = false;
    });
  });


  /* -------------------------------------------------------------- talking --- */

  /* The box everything later hangs off: shops, birthdays, what somebody
   * thinks of the house you are building. So it is worth it being right now
   * rather than being a tooltip.
   *
   * It is drawn on the canvas rather than in the page, at the island's own
   * scale and in the island's own typeface, because a browser's own text
   * floating over pixel art at three times the size is the one thing that
   * would break the spell. Painted once when somebody starts speaking and
   * stamped every frame after, since the words do not change while they are
   * being said.
   *
   * Walking away ends it. There is no way to get stuck in a conversation,
   * which matters more in a game with no fail state than any amount of
   * politeness about closing it properly. */
  var talking = null;                /* { p, art } while somebody is speaking */
  var PANEL = { pad: 7, line: 11, edge: 8 };
  var BOX = { ink: "#2d2317", paper: "#f7edd4", trim: "#cbb188" };

  /** Break a line to a width, in whole words. */
  function wrap(text, width, scale) {
    var words = T.speakable(text).split(" "), lines = [], at = "";
    words.forEach(function (w) {
      var try_ = at ? at + " " + w : w;
      if (T.measure(try_, 1) * scale > width && at) { lines.push(at); at = w; }
      else at = try_;
    });
    if (at) lines.push(at);
    return lines;
  }

  /* The whole box, painted once. */
  function speechArt(p) {
    var scale = 1;
    var inner = CAM.w - PANEL.edge * 2 - PANEL.pad * 2;
    var lines = wrap(p.who.line, inner, scale);
    var h = PANEL.pad * 2 + lines.length * PANEL.line + 12;
    var cv = document.createElement("canvas");
    cv.width = CAM.w - PANEL.edge * 2;
    cv.height = h;
    var c = cv.getContext("2d");
    c.imageSmoothingEnabled = false;

    /* a plain panel: one dark edge, one light inner line, and a flat ground */
    c.fillStyle = BOX.ink;
    c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = BOX.paper;
    c.fillRect(2, 2, cv.width - 4, cv.height - 4);
    c.fillStyle = BOX.trim;
    c.fillRect(2, 2, cv.width - 4, 1);
    c.fillRect(2, cv.height - 3, cv.width - 4, 1);
    /* the corners knocked off, so it is not a rectangle with a border */
    [[0, 0], [cv.width - 1, 0], [0, cv.height - 1], [cv.width - 1, cv.height - 1]]
      .forEach(function (k) { c.clearRect(k[0], k[1], 1, 1); });

    var tmp = document.createElement("canvas");
    /* the name, in the sea colour the rest of the chrome uses */
    T.render(tmp, p.name, { scale: 1, color: SEA, tracking: 1 });
    c.drawImage(tmp, PANEL.pad, PANEL.pad - 1);
    /* what they say */
    lines.forEach(function (ln, i) {
      T.render(tmp, ln, { scale: scale, color: BOX.ink, tracking: 1 });
      c.drawImage(tmp, PANEL.pad, PANEL.pad + 11 + i * PANEL.line);
    });
    return cv;
  }

  function startTalking(p) {
    if (!p) return;
    talking = { p: p, art: speechArt(p) };
    tellHint();
  }
  function stopTalking() {
    if (!talking) return;
    talking = null;
    tellHint();
  }

  /* A small bubble over the head of whoever you could speak to. Three dots,
   * because a key name would be a lie on a phone and an icon would be a
   * second alphabet to learn. */
  function drawBubble(p, cam) {
    var x = Math.round(p.x - cam.x), y = Math.round(p.y - cam.y) - S.SOLE + 4;
    var bob = Math.round(Math.sin(now / 260) * 1.5);
    y += bob;
    ctx.fillStyle = BOX.ink;
    ctx.fillRect(x - 8, y - 9, 16, 10);
    ctx.fillRect(x - 2, y + 1, 4, 3);
    ctx.fillStyle = BOX.paper;
    ctx.fillRect(x - 7, y - 8, 14, 8);
    ctx.fillRect(x - 1, y + 1, 2, 2);
    ctx.fillStyle = BOX.ink;
    for (var d = -1; d <= 1; d++) ctx.fillRect(x + d * 4 - 1, y - 5, 2, 2);
  }

  function drawSpeech() {
    if (!talking) return;
    var art = talking.art;
    ctx.drawImage(art, PANEL.edge, CAM.h - art.height - PANEL.edge);
  }

  /* ------------------------------------------------------------ the offer --- */

  var hintEl = document.getElementById("hint");
  var talkBtn = document.getElementById("talk-btn");
  var talkLabel = talkBtn.querySelector(".px");
  var HINT_IDLE = "Arrow keys or WASD to walk. On a phone, drag anywhere on the island or use the pad.";
  var shownHint = null;

  function tellHint() {
    var near = talking ? talking.p : whoIsNear();
    var want = talking ? "Space, or tap Done, to stop talking to " + talking.p.name
             : near ? "Press space to talk to " + near.name
             : HINT_IDLE;
    if (want !== shownHint) { hintEl.textContent = want; shownHint = want; }
    var label = talking ? "Done" : near ? "Talk to " + near.name : null;
    if (label !== talkBtn.dataset.label) {
      talkBtn.dataset.label = label || "";
      talkBtn.hidden = !label;
      if (label) {
        /* apply() takes its text from the element and remembers it, so the
         * old label has to be cleared or the button says "Talk to Marlow"
         * for ever. */
        talkLabel.removeAttribute("data-type");
        talkLabel.textContent = label;
        T.apply(talkLabel, { scale: 2, color: INK, tracking: 1 });
      }
    }
  }

  function talkKey() {
    if (talking) stopTalking();
    else startTalking(whoIsNear());
  }
  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "e" || e.key === "E" || e.key === "Enter") {
      talkKey(); e.preventDefault();
    } else if (e.key === "Escape") { stopTalking(); }
  });
  talkBtn.addEventListener("click", function (e) { e.preventDefault(); talkKey(); });

  /* -------------------------------------------------------------- drawing --- */

  /* Nothing on the island shares a clock. The light on the water slides a
   * pixel at a time, the waterline breathes on twelve frames, and every tree
   * leans on twenty-four of its own — offset from its neighbours by a
   * fraction of a second, so the field is weather rather than a metronome. */
  var now = 0;
  /* The island keeps the same time you do. */
  var clockMinutes = K.now();
  var clockEl = document.getElementById("clock");
  function tellTime() {
    clockMinutes = K.now();
    clockEl.textContent = K.clock(clockMinutes) + " \u00b7 " + K.momentAt(clockMinutes);
  }

  var view = document.getElementById("view");
  var ctx = view.getContext("2d");
  /* The view is smaller than the island and the camera follows you. Showing
   * the whole map at once put you at arm's length from it; a cozy game wants
   * you down among the grass. */
  var CAM = { w: 416, h: 320 };

  function fit() {
    /* An integer scale, always: half a pixel of a pixel is a smear. */
    var avail = Math.min(window.innerWidth - 26, 1240);
    var tall = window.innerHeight - 190;
    var k = Math.max(1, Math.min(3, Math.floor(avail / CAM.w), Math.floor(tall / CAM.h)));
    view.style.width = (CAM.w * k) + "px";
    view.style.height = (CAM.h * k) + "px";
  }
  window.addEventListener("resize", fit);

  function camera() {
    var cx = me.x - CAM.w / 2, cy = me.y - CAM.h / 2;
    /* Clamped to the map, so you never see past the edge of the world. When
     * the map is smaller than the view it is centred instead. */
    var maxX = map.w * TILE - CAM.w, maxY = map.h * TILE - CAM.h;
    cx = maxX <= 0 ? maxX / 2 : Math.max(0, Math.min(maxX, cx));
    cy = maxY <= 0 ? maxY / 2 : Math.max(0, Math.min(maxY, cy));
    return { x: Math.round(cx), y: Math.round(cy) };
  }

  /** The light on the water, slid sideways and clipped to the sea. */
  function drawSea(cam) {
    if (!water) return;
    var L = G.SEA.strip;
    var off = Math.floor(now / 1000 * G.SEA.speed) % L;
    ctx.save();
    ctx.beginPath();
    water.rects.forEach(function (r) {
      ctx.rect(r.x - cam.x, r.y - cam.y, r.w, r.h);
    });
    ctx.clip();
    for (var x = -off; x < map.w * TILE; x += L) {
      ctx.drawImage(seaCanvas, x - cam.x, water.y - cam.y);
    }
    ctx.restore();
  }

  /** A neighbour, with the same shadow the island casts under everything. */
  function drawNeighbour(p, cam) {
    var sx = Math.round(p.x - cam.x), sy = Math.round(p.y - cam.y);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#0d2a1e";
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.drawImage(p.art[p.dir + p.frame], sx - S.MIDX, sy - S.SOLE);
  }

  function drawPerson(cam) {
    /* your own shadow, cast fresh because you move */
    var sx = Math.round(me.x - cam.x), sy = Math.round(me.y - cam.y);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#0d2a1e";
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    /* The sprite is pinned by the row its feet stand on, which the sprite
     * itself publishes — it moved when the character was made shorter, and a
     * number copied here would have left them wading. */
    ctx.drawImage(meCanvas[me.dir + me.frame], sx - S.MIDX, sy - S.SOLE);
  }


  /* A character standing in lamplight, lit by the room.
   *
   * Washing the box they stand in was the obvious way and the wrong one: the
   * box is mostly not the character, so the window behind them went grey and
   * they walked about inside a dark rectangle. The evening is multiplied
   * onto a copy of the sprite instead and then masked back to the sprite's
   * own shape, so only the character is dimmed and the light behind them is
   * left alone. */
  var litCanvas = document.createElement("canvas");
  litCanvas.width = S.W; litCanvas.height = S.H;
  var litCtx = litCanvas.getContext("2d");
  function personInLamplight(tint, img) {
    litCtx.clearRect(0, 0, S.W, S.H);
    litCtx.globalCompositeOperation = "source-over";
    litCtx.drawImage(img, 0, 0);
    litCtx.globalCompositeOperation = "multiply";
    litCtx.fillStyle = tint;
    litCtx.fillRect(0, 0, S.W, S.H);
    litCtx.globalCompositeOperation = "destination-in";
    litCtx.drawImage(img, 0, 0);
    litCtx.globalCompositeOperation = "source-over";
    return litCanvas;
  }


  /* WHAT COMES OUT AFTER DARK.
   *
   * Stars on the water and fireflies over the grass. Both are fixed where
   * they are by the map, so they stay put from one visit to the next rather
   * than swimming about; both fade in on how deep the night is, so nothing
   * ever pops into existence; and both are drawn AFTER the evening, because
   * like a lit window they are lights rather than surfaces. Dimmed along
   * with the island they would be grey specks.
   *
   * The sea gets the stars because the sea is the only thing on the island
   * that could hold a reflection, and a top-down island has no sky to put
   * them in. */
  var NIGHTLIFE = (function () {
    var stars = [], flies = [];
    for (var ty = 0; ty < map.h; ty++) {
      for (var tx = 0; tx < map.w; tx++) {
        var kind = map.ground[ty * map.w + tx];
        if (kind === "water") {
          for (var n = 0; n < 3; n++) {
            stars.push({
              x: tx * TILE + G.hash(tx * 7 + n, ty * 13, 61) * TILE,
              y: ty * TILE + G.hash(tx * 11 + n, ty * 5, 62) * TILE,
              phase: G.hash(tx + n, ty, 63) * 6.283,
              rate: 900 + G.hash(tx, ty + n, 66) * 2600,
              bright: G.hash(tx, ty + n, 64) > 0.86
            });
          }
        } else if (kind === "grass" && G.hash(tx, ty, 65) > 0.79) {
          flies.push({
            x: tx * TILE + 6 + G.hash(tx, ty, 67) * 20,
            y: ty * TILE + 6 + G.hash(tx, ty, 68) * 20,
            r: 5 + G.hash(tx, ty, 69) * 11,
            phase: G.hash(tx, ty, 70) * 6.283,
            rate: 0.25 + G.hash(tx, ty, 71) * 0.35
          });
        }
      }
    }
    return { stars: stars, flies: flies };
  })();

  function nightLife(camX, camY) {
    var deep = K.nightness(clockMinutes);
    if (deep <= 0.02) return;
    var i, st;
    for (i = 0; i < NIGHTLIFE.stars.length; i++) {
      st = NIGHTLIFE.stars[i];
      /* Each on its own slow rate, or a sky full of them blinks in time. */
      var tw = 0.3 + 0.7 * Math.abs(Math.sin(now / st.rate + st.phase));
      ctx.globalAlpha = deep * tw * (st.bright ? 0.95 : 0.5);
      ctx.fillStyle = "#eef6ff";
      var sx = Math.round(st.x - camX), sy = Math.round(st.y - camY);
      ctx.fillRect(sx, sy, 1, 1);
      /* The brightest few throw a little cross when they catch. */
      if (st.bright && tw > 0.82) {
        ctx.globalAlpha = deep * (tw - 0.8) * 1.6;
        ctx.fillRect(sx - 1, sy, 1, 1); ctx.fillRect(sx + 1, sy, 1, 1);
        ctx.fillRect(sx, sy - 1, 1, 1); ctx.fillRect(sx, sy + 1, 1, 1);
      }
    }
    for (i = 0; i < NIGHTLIFE.flies.length; i++) {
      var f = NIGHTLIFE.flies[i];
      var t2 = now / 1000 * f.rate + f.phase;
      var fx = Math.round(f.x + Math.cos(t2) * f.r - camX);
      var fy = Math.round(f.y + Math.sin(t2 * 0.73) * f.r * 0.45 - camY);
      /* On for a moment, off for longer: a firefly is a blink, not a lamp. */
      var pulse = Math.pow(Math.max(0, Math.sin(t2 * 0.8)), 2);
      if (pulse < 0.02) continue;
      ctx.globalAlpha = deep * pulse * 0.32;
      ctx.fillStyle = "#e4ffa6";
      ctx.fillRect(fx - 1, fy - 1, 3, 3);
      ctx.globalAlpha = deep * pulse * 0.95;
      ctx.fillRect(fx, fy, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  /* The hour of the day, laid over the finished picture.
   *
   * Everything on the island is painted in daylight, so rather than paint it
   * all again for every hour — a second island in memory for each, and a
   * second set of every prop — the whole picture is multiplied by one colour
   * at the end. That is what sunlight does: light of a colour falls on a
   * surface of a colour and you get the two multiplied. A white noon changes
   * nothing, an amber evening warms everything by as much as its own colour
   * allows, and a blue night darkens the lot without flattening it.
   *
   * The lamps go on AFTER the wash, because a lit window is a light rather
   * than a surface: dimmed along with everything else it would just be a
   * slightly less dark window. */
  function daylight(cam) {
    var tint = K.lightAt(clockMinutes);
    if (tint !== "#ffffff") {
      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, CAM.w, CAM.h);
      ctx.restore();
    }
    nightLife(cam.x, cam.y);
    if (!K.isDark(clockMinutes)) return;
    var near = false, lit = [];
    var mx = Math.round(me.x - cam.x) - S.MIDX, my = Math.round(me.y - cam.y) - S.SOLE;
    map.props.forEach(function (p) {
      var lamps = P.PROPS[p.kind].lamps;
      if (!lamps) return;
      lamps.forEach(function (L) {
        var x = p.tx * TILE + p.jx + L[0] - cam.x, y = p.ty * TILE + p.jy + L[1] - cam.y;
        ctx.fillStyle = "#f7dd9a";
        ctx.fillRect(x, y, L[2], L[3]);
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#ffdf9c";
        ctx.fillRect(x - 3, y - 3, L[2] + 6, L[3] + 6);
        ctx.restore();
        lit.push({ x: x - 3, y: y - 3, w: L[2] + 6, h: L[3] + 6 });
        if (mx < x + L[2] + 3 && mx + S.W > x - 3 &&
            my < y + L[3] + 3 && my + S.H > y - 3) near = true;
      });
    });
    /* Standing in front of a window, you would have been painted over by the
     * light coming out of it — the lamps go on after the evening does. So
     * anyone caught in one is drawn again over the top, and then the evening
     * is laid over just them, which leaves them lit by the room rather than
     * cut out of it. */
    if (near) ctx.drawImage(personInLamplight(tint, meCanvas[me.dir + me.frame]), mx, my);
    /* And a neighbour standing under the same window, for the same reason. */
    folk.forEach(function (p) {
      var px = Math.round(p.x - cam.x) - S.MIDX, py = Math.round(p.y - cam.y) - S.SOLE;
      for (var i = 0; i < lit.length; i++) {
        var r = lit[i];
        if (px < r.x + r.w && px + S.W > r.x && py < r.y + r.h && py + S.H > r.y) {
          ctx.drawImage(personInLamplight(tint, p.art[p.dir + p.frame]), px, py);
          return;
        }
      }
    });
  }

  function paint() {
    var cam = camera();
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, CAM.w, CAM.h);
    ctx.drawImage(groundCanvas, -cam.x, -cam.y);
    var wash = tide[Math.floor(now / TIDE_MS) % SEA_FRAMES];
    if (wash) ctx.drawImage(wash.c, -cam.x, wash.y - cam.y);
    drawSea(cam);

    /* Everything standing on the ground, drawn in order of how far down the
     * screen its feet are. That one rule is what lets you walk behind a tree
     * and in front of its trunk. */
    var standing = map.props.map(function (p) {
      return { foot: (p.ty + P.PROPS[p.kind].h) * TILE, p: p };
    });
    standing.push({ foot: me.y, me: true });
    /* A neighbour is sorted in by their feet exactly as you are, so you pass
     * behind them and in front of them the same way you pass a tree.
     *
     * With one exception, which is whoever is speaking. A character is
     * seventy-two pixels tall standing on a thirty-two pixel tile, so anyone
     * you walk up to FROM BELOW disappears behind you almost entirely —
     * correct by the depth rule and useless to look at, since the whole
     * point of walking over was to see them. While the box is open the
     * speaker is drawn last. It is a deliberate lie about who is in front,
     * and it is the right one: you are facing each other. */
    folk.forEach(function (p) {
      standing.push({ foot: talking && talking.p === p ? Infinity : p.y, folk: p });
    });
    standing.sort(function (a, b) { return a.foot - b.foot; });

    standing.forEach(function (it) {
      if (it.me) { drawPerson(cam); return; }
      if (it.folk) { drawNeighbour(it.folk, cam); return; }
      var art = propCanvas[it.p.key + "@" +
        (it.p.moves ? Math.floor((now + it.p.offset) / LEAF_MS) % LEAF_FRAMES : 0)];
      ctx.drawImage(art.c, it.p.tx * TILE + it.p.jx + art.dx - cam.x,
                           it.p.ty * TILE + it.p.jy + art.dy - cam.y);
    });

    daylight(cam);
    /* The bubble and the box sit over the evening, not under it: they are
     * chrome, and a speech box that goes dim at night is a bug, not a mood. */
    var near = whoIsNear();
    if (near && !talking) drawBubble(near, cam);
    drawSpeech();
  }

  /* ----------------------------------------------------------------- loop --- */

  var last = 0, lastClock = -1e9;
  function tick(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    now = t;
    if (t - lastClock > 1000) { tellTime(); lastClock = t; }
    var a = axis();
    me.moving = !!(a.dx || a.dy);
    if (me.moving) {
      me.dir = a.dx ? (a.dx > 0 ? "right" : "left") : (a.dy > 0 ? "down" : "up");
      var step = SPEED * dt;
      /* Each axis on its own, so running along a fence slides rather than
       * stopping dead the moment one axis is blocked. */
      if (a.dx && footClear(me.x + a.dx * step, me.y)) me.x += a.dx * step;
      if (a.dy && footClear(me.x, me.y + a.dy * step)) me.y += a.dy * step;
      /* The walk cycle runs on distance covered, not on time, so it never
       * looks like the feet are skating. */
      me.step += step;
      me.frame = Math.floor(me.step / S.STRIDE) % 4;
    } else {
      me.step = 0; me.frame = 0;
    }
    /* Walk away and the conversation ends. There is no way to be stuck in
     * one, which matters more in a game with no fail state than any amount
     * of politeness about closing it properly. */
    if (talking) {
      var dx = talking.p.x - me.x, dy = talking.p.y - me.y;
      if (dx * dx + dy * dy > (TALK_R + 14) * (TALK_R + 14)) stopTalking();
    }
    folk.forEach(function (p) { amble(p, dt); });
    tellHint();
    paint();
    requestAnimationFrame(tick);
  }

  /* ----------------------------------------------------------------- chrome --- */

  T.apply(document.getElementById("wordmark"), { scale: 4, color: SEA, shadow: SHADOW, tracking: 1 });
  document.querySelectorAll(".btn .px").forEach(function (el) {
    T.apply(el, { scale: 2, color: INK, tracking: 1 });
  });
  document.getElementById("edit-btn").addEventListener("click", function () {
    window.location.href = "index.html";
  });

  fit();
  requestAnimationFrame(tick);

  /* If the creator saved you into the artifact's own store, prefer that. */
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (handle) {
      if (!handle) return;
      return handle.doc("characters/player").get().then(function (snap) {
        if (snap && snap.exists) {
          var data = snap.data();
          if (data && data.character) {
            who = Object.assign(S.defaultChar(), data.character);
            if (!Array.isArray(who.accessories)) who.accessories = [];
            rebuildMe();
          }
        }
      });
    }).catch(function () { /* the local copy stands */ });
  }
})();
</script>
